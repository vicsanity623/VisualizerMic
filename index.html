<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Visualizer"/>
<meta name="theme-color" content="#0a0a0f"/>
<link rel="manifest" href="manifest.json"/>
<!-- iOS icons (generate real ones for production) -->
<link rel="apple-touch-icon" href="icon-192.png"/>
<title>◈ Visualizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --gold: #c8a96e;
  --bg: #0a0a0f;
  --text: #f0ede8;
  --muted: rgba(240,237,232,0.4);
  --border: rgba(255,255,255,0.08);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
html, body {
  width: 100%; height: 100%;
  background: #000;
  overflow: hidden;
  font-family: 'DM Sans', sans-serif;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

/* ── WebGL canvas ── */
#glCanvas {
  position: fixed; inset: 0;
  width: 100%; height: 100%;
  display: block;
}

/* ── Frequency bars ── */
#freqCanvas {
  position: fixed; bottom: 0; left: 0;
  width: 100%; height: 120px;
  z-index: 4; pointer-events: none;
  opacity: 0.75;
}

/* ── Top bar ── */
#topBar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 10;
  display: flex; align-items: center; justify-content: center;
  padding-top: max(20px, var(--safe-top));
  padding-bottom: 16px;
  padding-left: 24px; padding-right: 24px;
  background: linear-gradient(to bottom, rgba(0,0,0,0.65) 0%, transparent 100%);
  pointer-events: none;
}
#vizLabel {
  font-family: 'Syne', sans-serif;
  font-size: 11px; font-weight: 700;
  letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--gold); opacity: 0.8;
}

/* ── Tap-to-start overlay ── */
#startOverlay {
  position: fixed; inset: 0; z-index: 30;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 0;
  background: rgba(10, 10, 15, 0.92);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  transition: opacity 0.55s ease;
}
#startOverlay.hidden {
  opacity: 0;
  pointer-events: none;
}

.logo-ring {
  width: 96px; height: 96px;
  border-radius: 50%;
  border: 1.5px solid rgba(200,169,110,0.35);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 32px;
  position: relative;
  animation: pulse-ring 2.8s ease-in-out infinite;
}
.logo-ring::before {
  content: '';
  position: absolute; inset: -10px;
  border-radius: 50%;
  border: 1px solid rgba(200,169,110,0.12);
  animation: pulse-ring 2.8s ease-in-out infinite 0.4s;
}
.logo-ring svg {
  width: 40px; height: 40px;
  color: var(--gold);
}
@keyframes pulse-ring {
  0%, 100% { opacity: 0.6; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.04); }
}

.start-title {
  font-family: 'Syne', sans-serif;
  font-size: 28px; font-weight: 800;
  color: var(--text);
  letter-spacing: 0.04em;
  margin-bottom: 10px;
  text-align: center;
}
.start-sub {
  font-size: 13px;
  color: var(--muted);
  letter-spacing: 0.08em;
  text-align: center;
  margin-bottom: 40px;
  padding: 0 32px;
  line-height: 1.7;
}

#startBtn {
  display: flex; align-items: center; gap: 10px;
  background: var(--gold);
  color: #0a0a0f;
  border: none;
  padding: 16px 36px;
  border-radius: 999px;
  font-family: 'Syne', sans-serif;
  font-size: 13px; font-weight: 700;
  letter-spacing: 0.15em; text-transform: uppercase;
  cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.2s;
  box-shadow: 0 0 32px rgba(200,169,110,0.3);
}
#startBtn:active {
  transform: scale(0.96);
  box-shadow: 0 0 16px rgba(200,169,110,0.2);
}
#startBtn svg { width: 16px; height: 16px; flex-shrink: 0; }

.start-note {
  margin-top: 20px;
  font-size: 11px;
  color: rgba(240,237,232,0.25);
  letter-spacing: 0.07em;
  text-align: center;
  padding: 0 40px;
}

/* ── Status pill ── */
#statusPill {
  position: fixed;
  bottom: calc(140px + var(--safe-bottom));
  left: 50%; transform: translateX(-50%);
  z-index: 10;
  display: flex; align-items: center; gap: 8px;
  padding: 10px 22px;
  background: rgba(10,10,15,0.55);
  border: 1px solid var(--border);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 999px;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s ease;
}
#statusPill.visible { opacity: 1; }

.dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: #555;
  transition: background 0.3s;
  flex-shrink: 0;
}
.dot.active { background: #4ade80; box-shadow: 0 0 6px #4ade80; animation: blink 1.6s ease-in-out infinite; }
.dot.idle   { background: var(--gold); }
.dot.error  { background: #f87171; }

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

#statusText {
  font-family: 'DM Sans', sans-serif;
  font-size: 12px; font-weight: 500;
  color: var(--text);
  letter-spacing: 0.07em;
}

/* ── Level meter arc ── */
#meterCanvas {
  position: fixed;
  bottom: calc(148px + var(--safe-bottom));
  left: 50%; transform: translateX(-50%);
  width: 200px; height: 60px;
  z-index: 9; pointer-events: none;
  opacity: 0;
  transition: opacity 0.6s ease;
}
#meterCanvas.visible { opacity: 1; }

/* ── Install banner ── */
#installBanner {
  position: fixed;
  top: calc(60px + var(--safe-top));
  left: 50%; transform: translateX(-50%) translateY(-20px);
  z-index: 20;
  display: flex; align-items: center; gap: 12px;
  padding: 12px 20px;
  background: rgba(10,10,15,0.8);
  border: 1px solid rgba(200,169,110,0.3);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-radius: 16px;
  max-width: calc(100vw - 48px);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s ease, transform 0.4s ease;
}
#installBanner.visible {
  opacity: 1;
  pointer-events: all;
  transform: translateX(-50%) translateY(0);
}
.install-text { font-size: 12px; color: var(--text); letter-spacing: 0.04em; line-height: 1.5; }
.install-text strong { color: var(--gold); font-weight: 600; }
#installBtn {
  background: var(--gold); color: #0a0a0f;
  border: none; border-radius: 999px;
  padding: 8px 16px;
  font-family: 'Syne', sans-serif;
  font-size: 11px; font-weight: 700;
  letter-spacing: 0.1em; text-transform: uppercase;
  cursor: pointer; flex-shrink: 0;
}
#dismissInstall {
  background: none; border: none;
  color: var(--muted); cursor: pointer;
  font-size: 18px; line-height: 1;
  padding: 2px 4px; flex-shrink: 0;
}
</style>

<!-- ═══════════════════════════════════════════
     VERTEX SHADER
════════════════════════════════════════════ -->
<script id="vs" type="x-shader/x-vertex">
attribute vec2 a_pos;
void main(){gl_Position=vec4(a_pos,0.,1.);}
</script>

<!-- ═══════════════════════════════════════════
     FRAGMENT SHADER — Domain-warped FBM smoke
     u_bass 0-1  → warp intensity, amber glow
     u_mid  0-1  → smoke speed, teal shimmer
     u_high 0-1  → turbulence, violet sparks
════════════════════════════════════════════ -->
<script id="fs" type="x-shader/x-fragment">
precision highp float;

uniform vec2  u_res;
uniform float u_time;
uniform float u_bass;
uniform float u_mid;
uniform float u_high;

vec3 mod289v3(vec3 x){return x-floor(x*(1./289.))*289.;}
vec2 mod289v2(vec2 x){return x-floor(x*(1./289.))*289.;}
vec3 permute3(vec3 x){return mod289v3(((x*34.)+1.)*x);}

float snoise(vec2 v){
  const vec4 C=vec4(.211324865405187,.366025403784439,-.577350269189626,.024390243902439);
  vec2 i=floor(v+dot(v,C.yy));
  vec2 x0=v-i+dot(i,C.xx);
  vec2 i1=(x0.x>x0.y)?vec2(1.,0.):vec2(0.,1.);
  vec4 x12=x0.xyxy+C.xxzz; x12.xy-=i1;
  i=mod289v2(i);
  vec3 p=permute3(permute3(i.y+vec3(0.,i1.y,1.))+i.x+vec3(0.,i1.x,1.));
  vec3 m=max(.5-vec3(dot(x0,x0),dot(x12.xy,x12.xy),dot(x12.zw,x12.zw)),0.);
  m=m*m; m=m*m;
  vec3 x2=2.*fract(p*.024390243902439)-1.;
  vec3 h=abs(x2)-.5;
  vec3 ox=floor(x2+.5);
  vec3 a0=x2-ox;
  m*=1.79284291400159-.85373472095314*(a0*a0+h*h);
  vec3 g; g.x=a0.x*x0.x+h.x*x0.y; g.yz=a0.yz*x12.xz+h.yz*x12.yw;
  return 130.*dot(m,g);
}

float fbm(vec2 p, int octs){
  float v=0., amp=.5;
  mat2 rot=mat2(1.6,1.2,-1.2,1.6);
  for(int i=0;i<8;i++){
    if(i>=octs) break;
    v+=amp*snoise(p);
    p=rot*p; amp*=.5;
  }
  return v;
}

float smoke(vec2 uv, float spd, float warp){
  vec2 q=vec2(fbm(uv,5), fbm(uv+vec2(5.2,1.3),5));
  vec2 r=vec2(fbm(uv+warp*q+vec2(1.7,9.2)+vec2(spd,0.),5),
               fbm(uv+warp*q+vec2(8.3,2.8)+vec2(spd,0.),5));
  return fbm(uv+warp*r, 6);
}

vec3 palette(float t, float bass, float mid, float high){
  vec3 d=vec3(fract(.00+bass*.42), fract(.33+mid*.30), fract(.67+high*.24));
  return .5+.5*cos(6.2831853*(vec3(1.)*t+d));
}

void main(){
  vec2 uv=(gl_FragCoord.xy-.5*u_res)/min(u_res.x,u_res.y);
  uv.y-=u_time*(.018+u_mid*.014);

  float warp=1.9+u_bass*2.8+u_mid*.7;
  float spd=u_time*(.05+u_mid*.08);

  float f=smoke(uv*1.65, spd, warp);
  float f2=smoke(uv*2.2+vec2(3.1,1.8), spd*1.35+.9, warp*.55);
  f=mix(f, f2, .20+u_high*.42);
  f=f*.5+.5;

  vec3 col=palette(f+u_time*.022, u_bass, u_mid, u_high);
  float density=smoothstep(.10,.84,f);
  col*=density;

  /* bass — warm amber glow at bottom-centre */
  vec2 g1=uv-vec2(0.,-.34);
  col+=vec3(.99,.63,.17)*exp(-dot(g1,g1)*2.6)*u_bass*.95;

  /* mid — cool teal shimmer at top-centre */
  vec2 g2=uv-vec2(0.,.30);
  col+=vec3(.28,.84,.78)*exp(-dot(g2,g2)*3.8)*u_mid*.55;

  /* high — violet sparks top-right */
  vec2 g3=uv-vec2(.35,.25);
  col+=vec3(.65,.25,.95)*exp(-dot(g3,g3)*5.)*u_high*.45;

  /* vignette */
  col*=1.-smoothstep(.42,1.28,length(uv*vec2(.72,1.)));

  /* star-dust particles on high freqs */
  float stars=step(.9945, fract(sin(dot(floor(uv*380.),vec2(127.1,311.7)))*43758.5));
  col+=stars*u_high*.7*vec3(.88,.82,1.);

  gl_FragColor=vec4(col,1.);
}
</script>
</head>
<body>

<canvas id="glCanvas"></canvas>
<canvas id="freqCanvas"></canvas>
<canvas id="meterCanvas"></canvas>

<!-- Top bar -->
<div id="topBar">
  <span id="vizLabel">◈ Visualizer</span>
</div>

<!-- Status pill -->
<div id="statusPill">
  <div class="dot" id="statusDot"></div>
  <span id="statusText">Idle</span>
</div>

<!-- Install banner -->
<div id="installBanner">
  <div class="install-text">
    <strong>Add to Home Screen</strong><br>
    Use as a native app
  </div>
  <button id="installBtn">Install</button>
  <button id="dismissInstall" aria-label="Dismiss">×</button>
</div>

<!-- Start overlay -->
<div id="startOverlay">
  <div class="logo-ring">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M9 18V5l12-2v13"/>
      <circle cx="6" cy="18" r="3"/>
      <circle cx="18" cy="16" r="3"/>
    </svg>
  </div>
  <div class="start-title">SoundVault</div>
  <div class="start-sub">
    An audio-reactive visualizer.<br>
    Tap to activate your microphone<br>
    and let sound shape the visuals.
  </div>
  <button id="startBtn">
    <svg viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
      <path d="M19 10v2a7 7 0 0 1-14 0v-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <line x1="12" y1="19" x2="12" y2="23" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <line x1="8" y1="23" x2="16" y2="23" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
    Activate Mic
  </button>
  <p class="start-note">Microphone access required · Works best with music playing aloud</p>
</div>

<script>
'use strict';

/* ══════════════════════════════════════════════
   SERVICE WORKER REGISTRATION
══════════════════════════════════════════════ */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(e => console.warn('[SW]', e));
  });
}

/* ══════════════════════════════════════════════
   PWA INSTALL PROMPT
══════════════════════════════════════════════ */
let deferredInstallPrompt = null;
const installBanner = document.getElementById('installBanner');
const installBtn    = document.getElementById('installBtn');
const dismissBtn    = document.getElementById('dismissInstall');

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredInstallPrompt = e;
  // Show banner after a short delay so it doesn't clash with the start overlay
  setTimeout(() => installBanner.classList.add('visible'), 3000);
});

installBtn.addEventListener('click', async () => {
  if (!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  const { outcome } = await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  installBanner.classList.remove('visible');
});

dismissBtn.addEventListener('click', () => {
  installBanner.classList.remove('visible');
});

window.addEventListener('appinstalled', () => {
  installBanner.classList.remove('visible');
  deferredInstallPrompt = null;
});

/* ══════════════════════════════════════════════
   WEBGL SETUP
══════════════════════════════════════════════ */
const canvas = document.getElementById('glCanvas');
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
if (!gl) {
  document.body.innerHTML = '<p style="color:#c8a96e;font-family:sans-serif;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;padding:24px">WebGL is not supported on this browser.</p>';
  throw new Error('no webgl');
}

function mkShader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src.trim());
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
  return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, mkShader(gl.VERTEX_SHADER,   document.getElementById('vs').textContent));
gl.attachShader(prog, mkShader(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent));
gl.linkProgram(prog);
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog, 'a_pos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

const uRes  = gl.getUniformLocation(prog, 'u_res');
const uTime = gl.getUniformLocation(prog, 'u_time');
const uBass = gl.getUniformLocation(prog, 'u_bass');
const uMid  = gl.getUniformLocation(prog, 'u_mid');
const uHigh = gl.getUniformLocation(prog, 'u_high');

/* ══════════════════════════════════════════════
   CANVAS RESIZE
══════════════════════════════════════════════ */
const fCanvas = document.getElementById('freqCanvas');
const fCtx    = fCanvas.getContext('2d');
const mCanvas = document.getElementById('meterCanvas');
const mCtx    = mCanvas.getContext('2d');

function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width  = innerWidth  * dpr;
  canvas.height = innerHeight * dpr;
  canvas.style.width  = innerWidth  + 'px';
  canvas.style.height = innerHeight + 'px';
  gl.viewport(0, 0, canvas.width, canvas.height);

  fCanvas.width  = innerWidth * dpr;
  fCanvas.height = 120 * dpr;
  fCanvas.style.width  = innerWidth + 'px';
  fCanvas.style.height = '120px';

  const mDpr = Math.min(dpr, 2);
  mCanvas.width  = 200 * mDpr;
  mCanvas.height = 60  * mDpr;
}
resize();
addEventListener('resize', resize);

/* ══════════════════════════════════════════════
   AUDIO — MICROPHONE
══════════════════════════════════════════════ */
let analyser, dataArray, bufLen;
let sB = 0, sM = 0, sH = 0;   // smoothed bass / mid / high
let hasAudio = false;

const statusPill = document.getElementById('statusPill');
const statusDot  = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const meterEl    = document.getElementById('meterCanvas');

function setStatus(state, msg) {
  statusDot.className = 'dot ' + state;
  statusText.textContent = msg;
  statusPill.classList.add('visible');
}

async function startMic() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    const ctx  = new (window.AudioContext || window.webkitAudioContext)();
    const src  = ctx.createMediaStreamSource(stream);
    analyser   = ctx.createAnalyser();
    analyser.fftSize = 2048;
    analyser.smoothingTimeConstant = 0.82;
    src.connect(analyser);
    // NOTE: do NOT connect analyser to destination — we don't want feedback
    bufLen    = analyser.frequencyBinCount;
    dataArray = new Uint8Array(bufLen);
    hasAudio  = true;
    setStatus('active', 'Listening');
    meterEl.classList.add('visible');
    return true;
  } catch (err) {
    console.warn('[Mic]', err);
    if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
      setStatus('error', 'Mic permission denied');
    } else {
      setStatus('error', 'Mic unavailable');
    }
    return false;
  }
}

/* ══════════════════════════════════════════════
   START OVERLAY — tap to begin
══════════════════════════════════════════════ */
const overlay  = document.getElementById('startOverlay');
const startBtn = document.getElementById('startBtn');
let started = false;

startBtn.addEventListener('click', async () => {
  if (started) return;
  started = true;
  startBtn.textContent = 'Activating…';
  startBtn.disabled = true;

  const ok = await startMic();
  overlay.classList.add('hidden');

  if (!ok) {
    // Still show the idle animation even without mic
    setStatus('idle', 'Demo mode');
  }
});

/* ══════════════════════════════════════════════
   READ FREQUENCY BANDS
══════════════════════════════════════════════ */
function readBands() {
  if (!hasAudio) {
    // Gentle idle drift when no audio
    const t = performance.now() / 1000;
    sB = 0.04 + 0.02 * Math.sin(t * 0.7);
    sM = 0.03 + 0.02 * Math.sin(t * 0.4 + 1.2);
    sH = 0.02 + 0.01 * Math.sin(t * 0.9 + 2.5);
    return;
  }
  analyser.getByteFrequencyData(dataArray);
  const be = Math.floor(bufLen * 0.05);
  const me = Math.floor(bufLen * 0.30);
  let bs = 0, ms = 0, hs = 0;
  for (let i = 0;   i < be;     i++) bs += dataArray[i];
  for (let i = be;  i < me;     i++) ms += dataArray[i];
  for (let i = me;  i < bufLen; i++) hs += dataArray[i];
  const bass = (bs / be)            / 255;
  const mid  = (ms / (me - be))     / 255;
  const high = (hs / (bufLen - me)) / 255;
  const k = 0.14;
  sB += k * (bass - sB);
  sM += k * (mid  - sM);
  sH += k * (high - sH);
}

/* ══════════════════════════════════════════════
   FREQUENCY BAR STRIP
══════════════════════════════════════════════ */
function drawBars() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const W = fCanvas.width, H = fCanvas.height;
  fCtx.clearRect(0, 0, W, H);
  if (!hasAudio) return;

  const bars = 160;
  const bw   = W / bars;

  for (let i = 0; i < bars; i++) {
    const t   = i / bars;
    const bin = Math.floor(Math.pow(t, 1.75) * bufLen * 0.65);
    const val = dataArray[Math.min(bin, bufLen - 1)] / 255;
    const bh  = val * H * 0.92;

    let r, g, b;
    if (t < 0.5) {
      const f = t * 2;
      r = Math.round(200 - f * 120);
      g = Math.round(100 + f * 110);
      b = Math.round(80  + f * 130);
    } else {
      const f = (t - 0.5) * 2;
      r = Math.round(80  + f * 100);
      g = Math.round(210 - f * 100);
      b = Math.round(210 + f * 45);
    }
    const alpha = 0.5 + val * 0.5;
    const x     = i * bw;
    const grad  = fCtx.createLinearGradient(0, H, 0, H - bh);
    grad.addColorStop(0, `rgba(${r},${g},${b},${alpha})`);
    grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
    fCtx.fillStyle = grad;
    fCtx.fillRect(x + 1, H - bh, bw - 2, bh);
  }
}

/* ══════════════════════════════════════════════
   LEVEL METER ARC
══════════════════════════════════════════════ */
function drawMeter() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const W = mCanvas.width, H = mCanvas.height;
  mCtx.clearRect(0, 0, W, H);

  if (!hasAudio) return;

  const level = Math.min(1, (sB + sM * 0.6 + sH * 0.3));
  const cx = W / 2, cy = H * 1.1;
  const r  = H * 0.85;
  const startA = Math.PI * 1.1;
  const endA   = Math.PI * 1.9;
  const fillA  = startA + (endA - startA) * level;

  // Track
  mCtx.beginPath();
  mCtx.arc(cx, cy, r, startA, endA);
  mCtx.strokeStyle = 'rgba(255,255,255,0.08)';
  mCtx.lineWidth = 3 * dpr;
  mCtx.lineCap = 'round';
  mCtx.stroke();

  // Fill
  if (level > 0.01) {
    const grad = mCtx.createLinearGradient(0, 0, W, 0);
    grad.addColorStop(0,   '#c8a96e');
    grad.addColorStop(0.5, '#4adecf');
    grad.addColorStop(1,   '#a855f7');
    mCtx.beginPath();
    mCtx.arc(cx, cy, r, startA, fillA);
    mCtx.strokeStyle = grad;
    mCtx.lineWidth = 3 * dpr;
    mCtx.lineCap = 'round';
    mCtx.stroke();
  }
}

/* ══════════════════════════════════════════════
   RENDER LOOP
══════════════════════════════════════════════ */
let t0 = null;
function frame(ts) {
  requestAnimationFrame(frame);
  if (!t0) t0 = ts;
  const t = (ts - t0) / 1000;

  readBands();
  drawBars();
  drawMeter();

  gl.uniform2f(uRes,  canvas.width, canvas.height);
  gl.uniform1f(uTime, t);
  gl.uniform1f(uBass, sB);
  gl.uniform1f(uMid,  sM);
  gl.uniform1f(uHigh, sH);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}
requestAnimationFrame(frame);
</script>
