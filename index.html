<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Visualizer"/>
<meta name="theme-color" content="#0a0a0f"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<title>◈ Visualizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --gold: #c8a96e;
  --bg: #0a0a0f;
  --text: #f0ede8;
  --muted: rgba(240,237,232,0.45);
  --border: rgba(255,255,255,0.09);
  --glass: rgba(8,8,14,0.72);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
}
html, body {
  width: 100%; height: 100%;
  background: #000; overflow: hidden;
  font-family: 'DM Sans', sans-serif;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

#glCanvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

#freqCanvas {
  position: fixed; bottom: 0; left: 0;
  width: 100%; height: 130px;
  z-index: 4; pointer-events: none; opacity: 0.7;
}

/* ─ Top bar ─ */
#topBar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 10;
  display: flex; align-items: center; justify-content: center;
  padding-top: max(18px, var(--safe-top));
  padding-bottom: 14px; padding-left: 20px; padding-right: 20px;
  background: linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, transparent 100%);
  pointer-events: none;
}
#vizLabel {
  font-family: 'Syne', sans-serif; font-size: 11px; font-weight: 700;
  letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold); opacity: 0.8;
}

/* ─ Landing ─ */
#landing {
  position: fixed; inset: 0; z-index: 20;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: rgba(8,8,14,0.93);
  backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
  transition: opacity 0.5s ease;
}
#landing.hidden { opacity: 0; pointer-events: none; }

.ring {
  width: 100px; height: 100px; border-radius: 50%;
  border: 1.5px solid rgba(200,169,110,0.3);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 30px; position: relative;
  animation: pulse 3s ease-in-out infinite;
}
.ring::before {
  content: ''; position: absolute; inset: -12px; border-radius: 50%;
  border: 1px solid rgba(200,169,110,0.10);
  animation: pulse 3s ease-in-out infinite 0.5s;
}
.ring svg { width: 42px; height: 42px; color: var(--gold); }
@keyframes pulse { 0%,100%{ opacity:.55; transform:scale(1); } 50%{ opacity:1; transform:scale(1.05); } }

.land-title { font-family: 'Syne', sans-serif; font-size: 30px; font-weight: 800; color: var(--text); letter-spacing: 0.03em; margin-bottom: 10px; }
.land-sub { font-size: 13px; color: var(--muted); letter-spacing: 0.06em; text-align: center; padding: 0 36px; line-height: 1.75; margin-bottom: 38px; }

#addMusicBtn {
  display: flex; align-items: center; gap: 10px;
  background: var(--gold); color: #0a0a0f;
  border: none; border-radius: 999px; padding: 17px 38px;
  font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700;
  letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer;
  box-shadow: 0 0 36px rgba(200,169,110,0.28);
  transition: transform 0.15s, box-shadow 0.15s;
}
#addMusicBtn:active { transform: scale(0.96); }
#addMusicBtn svg { width: 17px; height: 17px; flex-shrink: 0; }
#fileInput { display: none; }

/* ─ Player bg ─ */
#playerBg {
  position: fixed; bottom: 0; left: 0; right: 0; height: 230px;
  background: linear-gradient(to top, rgba(4,4,10,0.96) 0%, rgba(4,4,10,0.65) 60%, transparent 100%);
  z-index: 14; pointer-events: none;
  opacity: 0; transition: opacity 0.5s ease;
}
#playerBg.visible { opacity: 1; }

/* ─ Player ─ */
#player {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 15;
  padding-bottom: max(22px, var(--safe-bottom));
  padding-left: 22px; padding-right: 22px; padding-top: 0;
  display: flex; flex-direction: column; align-items: center; gap: 0;
  opacity: 0; pointer-events: none; transform: translateY(18px);
  transition: opacity 0.5s ease, transform 0.5s ease;
}
#player.visible { opacity: 1; pointer-events: all; transform: translateY(0); }

.track-row {
  display: flex; align-items: center; gap: 13px;
  width: 100%; max-width: 420px; margin-bottom: 13px;
}

#albumArt {
  width: 50px; height: 50px; border-radius: 10px;
  background: rgba(200,169,110,0.1);
  border: 1px solid rgba(200,169,110,0.2);
  flex-shrink: 0; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  position: relative;
}
#albumArt img { width: 100%; height: 100%; object-fit: cover; display: none; position: absolute; inset: 0; }
#albumArt .art-placeholder { width: 22px; height: 22px; color: var(--gold); opacity: 0.45; }

.track-info { flex: 1; min-width: 0; }
#trackTitle { font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700; color: var(--text); letter-spacing: 0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#trackMeta  { font-size: 11px; color: var(--muted); letter-spacing: 0.07em; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

#addMoreBtn {
  background: none; border: 1px solid var(--border);
  border-radius: 999px; padding: 7px 14px;
  color: var(--muted); font-size: 11px; font-family: 'DM Sans', sans-serif;
  letter-spacing: 0.06em; cursor: pointer; flex-shrink: 0;
  transition: border-color 0.2s, color 0.2s;
}
#addMoreBtn:active { color: var(--gold); border-color: rgba(200,169,110,0.4); }

/* Seek */
.seek-row {
  width: 100%; max-width: 420px;
  display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
}
.time-lbl { font-size: 10px; color: var(--muted); letter-spacing: 0.05em; min-width: 32px; font-variant-numeric: tabular-nums; }
.time-lbl.r { text-align: right; }

#seekBar {
  flex: 1; -webkit-appearance: none; appearance: none;
  height: 3px; border-radius: 2px; background: rgba(255,255,255,0.13);
  outline: none; cursor: pointer;
}
#seekBar::-webkit-slider-thumb {
  -webkit-appearance: none; width: 15px; height: 15px; border-radius: 50%;
  background: var(--gold); box-shadow: 0 0 8px rgba(200,169,110,0.5); cursor: pointer;
}
#seekBar::-moz-range-thumb {
  width: 15px; height: 15px; border-radius: 50%;
  background: var(--gold); border: none; cursor: pointer;
}

/* Controls */
.ctrl-row { display: flex; align-items: center; justify-content: center; gap: 26px; width: 100%; max-width: 420px; }

.ctrl-btn {
  background: none; border: none; color: var(--text);
  cursor: pointer; padding: 8px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  transition: color 0.15s, transform 0.15s; opacity: 0.85;
}
.ctrl-btn:active { transform: scale(0.88); color: var(--gold); }
.ctrl-btn svg { width: 26px; height: 26px; }

#playPauseBtn {
  background: var(--gold); color: #0a0a0f;
  width: 58px; height: 58px; border-radius: 50%;
  box-shadow: 0 0 28px rgba(200,169,110,0.3); opacity: 1;
}
#playPauseBtn svg { width: 24px; height: 24px; }
#playPauseBtn:active { transform: scale(0.92); }

/* ─ Mic button ─ */
#micBtn {
  position: fixed;
  bottom: calc(max(22px, var(--safe-bottom)) + 188px);
  left: calc(22px + var(--safe-left));
  z-index: 16;
  width: 42px; height: 42px; border-radius: 50%;
  background: var(--glass);
  border: 1px solid var(--border);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  opacity: 0; pointer-events: none; transform: scale(0.8);
  transition: opacity 0.4s ease, transform 0.4s ease, border-color 0.2s, background 0.2s, box-shadow 0.2s;
}
#micBtn.visible { opacity: 1; pointer-events: all; transform: scale(1); }
#micBtn.active {
  border-color: rgba(74,222,128,0.5); background: rgba(74,222,128,0.12);
  box-shadow: 0 0 14px rgba(74,222,128,0.25);
}
#micBtn svg { width: 18px; height: 18px; color: var(--muted); transition: color 0.2s; }
#micBtn.active svg { color: #4ade80; }
.mic-dot {
  position: absolute; top: 2px; right: 2px;
  width: 8px; height: 8px; border-radius: 50%;
  background: #4ade80; box-shadow: 0 0 6px #4ade80;
  display: none; animation: mblink 1.4s ease-in-out infinite;
}
#micBtn.active .mic-dot { display: block; }
@keyframes mblink { 0%,100%{opacity:1} 50%{opacity:0.3} }

/* ─ Queue badge ─ */
#queueBadge {
  position: fixed;
  bottom: calc(max(22px, var(--safe-bottom)) + 188px);
  right: 22px; z-index: 16;
  display: flex; align-items: center; gap: 6px;
  padding: 9px 14px;
  background: var(--glass); border: 1px solid var(--border);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-radius: 999px;
  opacity: 0; pointer-events: none; transform: scale(0.8);
  transition: opacity 0.4s ease, transform 0.4s ease;
}
#queueBadge.visible { opacity: 1; pointer-events: all; transform: scale(1); }
#queueBadge svg { width: 13px; height: 13px; color: var(--gold); opacity: 0.7; }
#queueCount { font-size: 11px; color: var(--muted); letter-spacing: 0.06em; }
</style>

<script id="vs" type="x-shader/x-vertex">
attribute vec2 a_pos;
void main(){ gl_Position = vec4(a_pos, 0., 1.); }
</script>

<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform vec2  u_res;
uniform float u_time;
uniform float u_bass;
uniform float u_mid;
uniform float u_high;

vec3 mod289v3(vec3 x){ return x-floor(x*(1./289.))*289.; }
vec2 mod289v2(vec2 x){ return x-floor(x*(1./289.))*289.; }
vec3 permute3(vec3 x){ return mod289v3(((x*34.)+1.)*x); }

float snoise(vec2 v){
  const vec4 C=vec4(.211324865405187,.366025403784439,-.577350269189626,.024390243902439);
  vec2 i=floor(v+dot(v,C.yy)); vec2 x0=v-i+dot(i,C.xx);
  vec2 i1=(x0.x>x0.y)?vec2(1.,0.):vec2(0.,1.);
  vec4 x12=x0.xyxy+C.xxzz; x12.xy-=i1;
  i=mod289v2(i);
  vec3 p=permute3(permute3(i.y+vec3(0.,i1.y,1.))+i.x+vec3(0.,i1.x,1.));
  vec3 m=max(.5-vec3(dot(x0,x0),dot(x12.xy,x12.xy),dot(x12.zw,x12.zw)),0.);
  m=m*m; m=m*m;
  vec3 x2=2.*fract(p*.024390243902439)-1.; vec3 h=abs(x2)-.5;
  vec3 ox=floor(x2+.5); vec3 a0=x2-ox;
  m*=1.79284291400159-.85373472095314*(a0*a0+h*h);
  vec3 g; g.x=a0.x*x0.x+h.x*x0.y; g.yz=a0.yz*x12.xz+h.yz*x12.yw;
  return 130.*dot(m,g);
}

float fbm(vec2 p, int octs){
  float v=0.,amp=.5;
  mat2 rot=mat2(1.6,1.2,-1.2,1.6);
  for(int i=0;i<8;i++){ if(i>=octs) break; v+=amp*snoise(p); p=rot*p; amp*=.5; }
  return v;
}

float smoke(vec2 uv, float spd, float warp){
  vec2 q=vec2(fbm(uv,5),fbm(uv+vec2(5.2,1.3),5));
  vec2 r=vec2(fbm(uv+warp*q+vec2(1.7,9.2)+vec2(spd,0.),5),
              fbm(uv+warp*q+vec2(8.3,2.8)+vec2(spd,0.),5));
  return fbm(uv+warp*r,6);
}

vec3 palette(float t, float bass, float mid, float high){
  vec3 d=vec3(fract(.00+bass*.42),fract(.33+mid*.30),fract(.67+high*.24));
  return .5+.5*cos(6.2831853*(vec3(1.)*t+d));
}

void main(){
  vec2 uv=(gl_FragCoord.xy-.5*u_res)/min(u_res.x,u_res.y);
  /* ✓ NO uv.y offset — drift bug fixed */

  float warp=1.8+u_bass*2.4+u_mid*0.2;
  float spd=u_time*(.05+u_mid*.02);

  float f=smoke(uv*0.9,spd,warp);
  float f2=smoke(uv*2.5+vec2(3.1,1.8),spd*1.35+.9,warp*.55);
  f=mix(f,f2,.20+u_high*.42);
  f=f*.5+.5;

  vec3 col=palette(f+u_time*.022,u_bass,u_mid,u_high);
  float density=smoothstep(.10,.84,f);
  col*=density;

  vec2 g1=uv-vec2(0.,-.34);
  col+=vec3(.99,.63,.17)*exp(-dot(g1,g1)*2.6)*u_bass*.95;
  vec2 g2=uv-vec2(0.,.30);
  col+=vec3(.28,.84,.78)*exp(-dot(g2,g2)*3.8)*u_mid*.55;
  vec2 g3=uv-vec2(.35,.25);
  col+=vec3(.65,.25,.95)*exp(-dot(g3,g3)*5.)*u_high*.45;

  col*=1.-smoothstep(.42,1.28,length(uv*vec2(.72,1.)));

  float stars=step(.9945,fract(sin(dot(floor(uv*380.),vec2(127.1,311.7)))*43758.5));
  col+=stars*u_high*.7*vec3(.88,.82,1.);

  gl_FragColor=vec4(col,1.);
}
</script>
</head>
<body>

<canvas id="glCanvas"></canvas>
<canvas id="freqCanvas"></canvas>
<input type="file" id="fileInput" accept="audio/*,audio/mpeg,audio/mp4,audio/wav,audio/ogg,audio/flac,audio/aac,audio/x-m4a,audio/m4a,.mp3,.m4a,.wav,.ogg,.flac,.aac,.opus,.wma,.aiff,.aif" multiple/>

<div id="topBar"><span id="vizLabel">◈ Visualizer</span></div>

<!-- Landing -->
<div id="landing">
  <div class="ring">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M9 18V5l12-2v13"/>
      <circle cx="6" cy="18" r="3"/>
      <circle cx="18" cy="16" r="3"/>
    </svg>
  </div>
  <div class="land-title">Visualizer</div>
  <div class="land-sub">Add music files to begin.<br>The visuals will react to every beat.</div>
  <button id="addMusicBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round">
      <path d="M12 5v14M5 12h14"/>
    </svg>
    Add Music
  </button>
</div>

<div id="playerBg"></div>

<!-- Player -->
<div id="player">
  <div class="track-row">
    <div id="albumArt">
      <img id="artImg" alt=""/>
      <svg class="art-placeholder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
        <circle cx="12" cy="12" r="9" stroke-opacity="0.5"/>
        <circle cx="12" cy="12" r="3.5"/>
        <circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/>
      </svg>
    </div>
    <div class="track-info">
      <div id="trackTitle">—</div>
      <div id="trackMeta">—</div>
    </div>
    <button id="addMoreBtn">+ Add</button>
  </div>

  <div class="seek-row">
    <span class="time-lbl" id="timeElapsed">0:00</span>
    <input type="range" id="seekBar" min="0" max="100" value="0" step="0.1"/>
    <span class="time-lbl r" id="timeDuration">0:00</span>
  </div>

  <div class="ctrl-row">
    <button class="ctrl-btn" id="prevBtn" aria-label="Previous">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
    </button>
    <button class="ctrl-btn" id="playPauseBtn" aria-label="Play/Pause">
      <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
    </button>
    <button class="ctrl-btn" id="nextBtn" aria-label="Next">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zm2.5-6L13 9v6l-4.5-3zm7.5 6h2V6h-2v12z"/></svg>
    </button>
  </div>
</div>

<!-- Mic toggle -->
<button id="micBtn" aria-label="Toggle microphone">
  <div class="mic-dot"></div>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
    <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
    <line x1="12" y1="19" x2="12" y2="23"/>
    <line x1="8"  y1="23" x2="16" y2="23"/>
  </svg>
</button>

<!-- Queue badge -->
<div id="queueBadge">
  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h10v2H4z"/></svg>
  <span id="queueCount">0 tracks</span>
</div>

<script>
'use strict';

/* ══ SERVICE WORKER ══ */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}

/* ══ WEBGL ══ */
const glCanvas = document.getElementById('glCanvas');
const gl = glCanvas.getContext('webgl') || glCanvas.getContext('experimental-webgl');
if (!gl) { document.body.innerHTML='<p style="color:#c8a96e;font-family:sans-serif;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center">WebGL not supported.</p>'; throw 0; }

function mkShader(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src.trim()); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, mkShader(gl.VERTEX_SHADER,   document.getElementById('vs').textContent));
gl.attachShader(prog, mkShader(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent));
gl.linkProgram(prog); gl.useProgram(prog);

const vBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vBuf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog, 'a_pos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

const uRes=gl.getUniformLocation(prog,'u_res'), uTime=gl.getUniformLocation(prog,'u_time'),
      uBass=gl.getUniformLocation(prog,'u_bass'), uMid=gl.getUniformLocation(prog,'u_mid'),
      uHigh=gl.getUniformLocation(prog,'u_high');

/* ══ RESIZE ══ */
const fCanvas=document.getElementById('freqCanvas'), fCtx=fCanvas.getContext('2d');
function resize(){
  const dpr=Math.min(devicePixelRatio||1,2);
  glCanvas.width=innerWidth*dpr; glCanvas.height=innerHeight*dpr;
  glCanvas.style.width=innerWidth+'px'; glCanvas.style.height=innerHeight+'px';
  gl.viewport(0,0,glCanvas.width,glCanvas.height);
  fCanvas.width=innerWidth*dpr; fCanvas.height=130*dpr;
  fCanvas.style.width=innerWidth+'px'; fCanvas.style.height='130px';
}
resize(); addEventListener('resize', resize);

/* ══ AUDIO ENGINE ══ */
let audioCtx=null, analyser=null, dataArray=null, bufLen=0;
let micStream=null, micSource=null, mediaSource=null;
let sB=0, sM=0, sH=0;

function ensureCtx(){
  if (audioCtx) return;
  audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 2048;
  analyser.smoothingTimeConstant = 0.83;
  analyser.connect(audioCtx.destination);
  bufLen = analyser.frequencyBinCount;
  dataArray = new Uint8Array(bufLen);
}

/* ══ QUEUE / PLAYER ══ */
const audio = new Audio();
audio.preload = 'auto';

let queue=[], queueIndex=0, isPlaying=false;

const landing     = document.getElementById('landing');
const playerEl    = document.getElementById('player');
const playerBg    = document.getElementById('playerBg');
const micBtn      = document.getElementById('micBtn');
const queueBadge  = document.getElementById('queueBadge');
const queueCountEl= document.getElementById('queueCount');
const trackTitle  = document.getElementById('trackTitle');
const trackMeta   = document.getElementById('trackMeta');
const artImg      = document.getElementById('artImg');
const artPlaceholder = document.querySelector('.art-placeholder');
const seekBar     = document.getElementById('seekBar');
const timeElapsed = document.getElementById('timeElapsed');
const timeDuration= document.getElementById('timeDuration');
const playPauseBtn= document.getElementById('playPauseBtn');
const playIcon    = document.getElementById('playIcon');
const pauseIcon   = document.getElementById('pauseIcon');
const fileInput   = document.getElementById('fileInput');

const fmt = s => { if(isNaN(s)) return '0:00'; const m=Math.floor(s/60),ss=Math.floor(s%60); return m+':'+String(ss).padStart(2,'0'); };
const setPlayIcon = p => { playIcon.style.display=p?'none':''; pauseIcon.style.display=p?'':'none'; };

/* Simple ID3 art extractor */
async function extractArt(file) {
  return new Promise(resolve => {
    const fr = new FileReader();
    fr.onload = e => {
      try {
        const buf=e.target.result, view=new Uint8Array(buf);
        for (let i=0; i<Math.min(view.length-10,600000); i++) {
          if (view[i]===0x41&&view[i+1]===0x50&&view[i+2]===0x49&&view[i+3]===0x43) {
            let ptr=i+10+1;
            while(ptr<view.length&&view[ptr]!==0) ptr++; ptr+=2;
            while(ptr<view.length&&view[ptr]!==0) ptr++; ptr++;
            const sz=((view[i+4]&0x7f)<<21)|((view[i+5]&0x7f)<<14)|((view[i+6]&0x7f)<<7)|(view[i+7]&0x7f);
            const end=i+10+sz;
            const imgData=buf.slice(ptr,Math.min(end,buf.byteLength));
            const mime=new Uint8Array(imgData)[0]===0x89?'image/png':'image/jpeg';
            resolve(URL.createObjectURL(new Blob([imgData],{type:mime}))); return;
          }
        }
        resolve(null);
      } catch { resolve(null); }
    };
    fr.onerror=()=>resolve(null);
    fr.readAsArrayBuffer(file.slice(0,600000));
  });
}

async function addFiles(files) {
  const wasEmpty = queue.length === 0;
  for (const file of files) {
    const url  = URL.createObjectURL(file);
    const title = file.name.replace(/\.[^.]+$/, '');
    const art  = await extractArt(file);
    queue.push({ url, title, art });
  }
  updateBadge();
  if (wasEmpty) { loadTrack(0); showPlayer(); }
}

function updateBadge() {
  queueCountEl.textContent = queue.length + (queue.length===1?' track':' tracks');
  queueBadge.classList.toggle('visible', queue.length>0);
}

function loadTrack(idx) {
  if (!queue.length) return;
  queueIndex = ((idx % queue.length) + queue.length) % queue.length;
  const t = queue[queueIndex];
  audio.src = t.url; audio.load();
  trackTitle.textContent = t.title;
  trackMeta.textContent  = `Track ${queueIndex+1} of ${queue.length}`;
  if (t.art) {
    artImg.src=t.art; artImg.style.display='block'; artPlaceholder.style.display='none';
  } else {
    artImg.style.display='none'; artPlaceholder.style.display='';
  }
  seekBar.value=0; timeElapsed.textContent='0:00'; timeDuration.textContent='0:00';
  if (isPlaying) playAudio();
}

function playAudio() {
  ensureCtx();
  if (!mediaSource) {
    mediaSource = audioCtx.createMediaElementSource(audio);
    mediaSource.connect(analyser);
  }
  if (audioCtx.state==='suspended') audioCtx.resume();
  audio.play().then(()=>{ isPlaying=true; setPlayIcon(true); }).catch(console.warn);
}
function pauseAudio() { audio.pause(); isPlaying=false; setPlayIcon(false); }

function showPlayer() {
  landing.classList.add('hidden');
  playerEl.classList.add('visible');
  playerBg.classList.add('visible');
  micBtn.classList.add('visible');
  queueBadge.classList.add('visible');
}

audio.addEventListener('ended', () => { loadTrack(queueIndex+1); playAudio(); });
audio.addEventListener('timeupdate', () => {
  if (!audio.duration) return;
  seekBar.value = (audio.currentTime/audio.duration)*100;
  timeElapsed.textContent  = fmt(audio.currentTime);
  timeDuration.textContent = fmt(audio.duration);
});
audio.addEventListener('loadedmetadata', () => { timeDuration.textContent=fmt(audio.duration); });

playPauseBtn.addEventListener('click', () => isPlaying ? pauseAudio() : playAudio());
document.getElementById('prevBtn').addEventListener('click', () => {
  if (audio.currentTime>3) { audio.currentTime=0; } else { loadTrack(queueIndex-1); if(isPlaying) playAudio(); }
});
document.getElementById('nextBtn').addEventListener('click', () => { loadTrack(queueIndex+1); if(isPlaying) playAudio(); });

let scrubbing=false;
seekBar.addEventListener('mousedown',  ()=>scrubbing=true);
seekBar.addEventListener('touchstart', ()=>scrubbing=true, {passive:true});
seekBar.addEventListener('mouseup',  ()=>{ scrubbing=false; if(audio.duration) audio.currentTime=(seekBar.value/100)*audio.duration; });
seekBar.addEventListener('touchend', ()=>{ scrubbing=false; if(audio.duration) audio.currentTime=(seekBar.value/100)*audio.duration; });
seekBar.addEventListener('input', ()=>{ timeElapsed.textContent=fmt((seekBar.value/100)*(audio.duration||0)); });

fileInput.addEventListener('change', e => { if(e.target.files.length) addFiles(Array.from(e.target.files)); fileInput.value=''; });
document.getElementById('addMusicBtn').addEventListener('click', ()=>fileInput.click());
document.getElementById('addMoreBtn').addEventListener('click', ()=>fileInput.click());

/* ══ MIC ══ */
let micActive=false;
micBtn.addEventListener('click', async ()=>{ micActive ? stopMic() : await startMic(); });

async function startMic() {
  try {
    ensureCtx();
    micStream = await navigator.mediaDevices.getUserMedia({audio:true,video:false});
    micSource = audioCtx.createMediaStreamSource(micStream);
    micSource.connect(analyser);
    micActive=true; micBtn.classList.add('active');
  } catch(e){ console.warn('[Mic]',e); }
}
function stopMic() {
  micSource?.disconnect(); micSource=null;
  micStream?.getTracks().forEach(t=>t.stop()); micStream=null;
  micActive=false; micBtn.classList.remove('active');
}

/* ══ BANDS ══ */
function readBands() {
  if (!analyser||!dataArray) {
    const t=performance.now()/1000;
    sB=0.05+0.025*Math.sin(t*0.6); sM=0.04+0.020*Math.sin(t*0.38+1.1); sH=0.02+0.012*Math.sin(t*0.85+2.4);
    return;
  }
  analyser.getByteFrequencyData(dataArray);
  const be=Math.floor(bufLen*0.05), me=Math.floor(bufLen*0.30);
  let bs=0,ms=0,hs=0;
  for(let i=0;   i<be;    i++) bs+=dataArray[i];
  for(let i=be;  i<me;    i++) ms+=dataArray[i];
  for(let i=me;  i<bufLen;i++) hs+=dataArray[i];
  const k=0.14;
  sB+=k*(bs/be/255-sB); sM+=k*(ms/(me-be)/255-sM); sH+=k*(hs/(bufLen-me)/255-sH);
}

/* ══ FREQ BARS ══ */
function drawBars() {
  const W=fCanvas.width, H=fCanvas.height;
  fCtx.clearRect(0,0,W,H);
  if (!dataArray) return;
  const bars=160, bw=W/bars;
  for (let i=0;i<bars;i++) {
    const t=i/bars, bin=Math.floor(Math.pow(t,1.75)*bufLen*0.65);
    const val=dataArray[Math.min(bin,bufLen-1)]/255, bh=val*H*0.92;
    let r,g,b;
    if(t<0.5){ const f=t*2; r=Math.round(200-f*120); g=Math.round(100+f*110); b=Math.round(80+f*130); }
    else { const f=(t-.5)*2; r=Math.round(80+f*100); g=Math.round(210-f*100); b=Math.round(210+f*45); }
    const alpha=0.5+val*0.5;
    const grad=fCtx.createLinearGradient(0,H,0,H-bh);
    grad.addColorStop(0,`rgba(${r},${g},${b},${alpha})`);
    grad.addColorStop(1,`rgba(${r},${g},${b},0)`);
    fCtx.fillStyle=grad;
    fCtx.fillRect(i*bw+1,H-bh,bw-2,bh);
  }
}

/* ══ RENDER LOOP ══ */
let t0=null;
function frame(ts) {
  requestAnimationFrame(frame);
  if (!t0) t0=ts;
  readBands(); drawBars();
  gl.uniform2f(uRes, glCanvas.width, glCanvas.height);
  gl.uniform1f(uTime, (ts-t0)/1000);
  gl.uniform1f(uBass, sB); gl.uniform1f(uMid, sM); gl.uniform1f(uHigh, sH);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}
requestAnimationFrame(frame);
</script>
